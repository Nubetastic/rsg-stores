<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>rsg-stores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="vignette"></div>

<div id="app" class="hidden">
    <div class="shop-panel">
        <div class="shop-header">
            <button id="closeBtn" class="icon-btn">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="shop-title-wrap">
                <div class="shop-title" id="shopTitle"></div>
                <div class="shop-subtitle" id="shopSubtitle"></div>
            </div>
            <div class="basket-count-wrap">
                <i class="fa-solid fa-basket-shopping"></i>
                <span id="basketCount">0</span>/<span id="basketMax">10</span>
            </div>
        </div>

        <div class="mode-tabs" id="modeTabs">
            <button class="mode-tab active" id="buyTab" data-mode="buy"></button>
            <button class="mode-tab hidden" id="sellTab" data-mode="sell"></button>
        </div>

        <div class="ink-divider"></div>

        <div class="shop-body">
            <div class="category-rail" id="categoryRail"></div>

            <div class="item-grid" id="itemGrid"></div>
        </div>

        <div class="basket-bar">
            <div class="basket-header">
                <span class="basket-heading" id="basketHeading"></span>
                <span class="basket-hint"><span id="basketHintPrefix"></span> <span id="basketMaxHint">10</span> <span id="basketHintSuffix"></span></span>
            </div>

            <div class="basket-rows" id="basketRows">
                <div class="basket-empty" id="basketEmpty"></div>
            </div>

            <div class="basket-footer">
                <div class="basket-total">
                    <span id="basketTotalLabel"></span> <span id="basketTotal">$0</span>
                </div>
                <div class="basket-actions">
                    <button id="clearBtn" class="wood-btn muted"></button>
                    <button id="checkoutBtn" class="wood-btn primary" disabled></button>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="toasts"></div>

<script src="script.js"></script>
</body>
</html>
